[build-system]
requires = ["scikit-build-core>=1.0,<2", "setuptools-scm>=8,<10"]
build-backend = "scikit_build_core.build"

[project]
name = "uc-picker"
dynamic = ["version"]
description = "Generate hardware simulation interfaces for multiple programming languages"
readme = "README.md"
requires-python = ">=3.11"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "uc-xcomm>=1.1,<2",
    "swig==4.5.1",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
fallback_version = "2.0.0.dev0"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
git_describe_command = 'git describe --dirty --tags --long --match "v[0-9]*"'
local_scheme = "no-local-version"

[tool.scikit-build]
wheel.install-dir = "picker"
wheel.py-api = "py3"
build.targets = ["picker"]
wheel.packages = ["src/python/picker"]

[project.scripts]
picker = "picker:cmd"

[tool.cibuildwheel]
build = ["cp312-manylinux_x86_64"]
build-frontend = "build"
environment = { CMAKE_GENERATOR = "Unix Makefiles", CMAKE_BUILD_PARALLEL_LEVEL = "4", CXXFLAGS = "-march=x86-64 -mtune=generic", LDFLAGS = "-static-libstdc++ -static-libgcc" }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:076b19ef6e698f28649fa817c49d14443201e01da85240e8e52f93e8daa49bff"
repair-wheel-command = "auditwheel repair --only-plat --plat manylinux_2_28_x86_64 -w {dest_dir} {wheel}"
