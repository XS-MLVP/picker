name: Development CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore: [master]

permissions:
  contents: read
  packages: read

concurrency:
  group: picker-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s test/release -v

  branch-or-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run_build: ${{ steps.decide.outputs.run_build }}
    steps:
      - name: Skip branch build when a master PR already exists
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'run_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            -f base=master -f state=open --jq 'length')
          if [[ "$count" == 0 ]]; then
            echo 'run_build=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping branch build: ${count} open master PR(s) run their own CI"
            echo 'run_build=false' >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: branch-or-pr
    if: needs.branch-or-pr.outputs.run_build == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            verilator_override: ''
            full_test: true
          - os: ubuntu-22.04-arm
            verilator_override: ''
            full_test: true
          - os: ubuntu-22.04
            verilator_override: v5.026
            full_test: false
    runs-on: ${{ matrix.os }}
    env:
      BUILD_XSPCOMM_SWIG: python,java
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load shared tool versions
        run: |
          set -euo pipefail
          VERILATOR_VERSION='${{ matrix.verilator_override }}'
          if [ -z "${VERILATOR_VERSION}" ]; then
            VERILATOR_VERSION=$(sed -n 's/^  verilator:[[:space:]]*//p' .build-config.yml)
          fi
          echo "VERILATOR_VERSION=${VERILATOR_VERSION}" >> "$GITHUB_ENV"
          echo "SWIG_VERSION=$(sed -n 's/^  swig:[[:space:]]*//p' .build-config.yml)" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$(sed -n 's/^  node:[[:space:]]*//p' .build-config.yml)" >> "$GITHUB_ENV"
          echo "PYTHON_VERSION=$(sed -n 's/^  python:[[:space:]]*//p' .build-config.yml)" >> "$GITHUB_ENV"

      - name: Install native build toolchain
        run: bash scripts/build/setup-native-toolchain.sh

      - name: Set Verilator cache path
        run: |
          set -euo pipefail
          echo "VERILATOR_PREFIX=${HOME}/.cache/verilator/${VERILATOR_VERSION}" >> "$GITHUB_ENV"
      
      - name: Restore Verilator fakeroot cache
        id: cache-verilator
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/verilator/${{ env.VERILATOR_VERSION }}
          key: verilator-${{ matrix.os }}-${{ env.VERILATOR_VERSION }}-v1

      - name: Install or reuse Verilator
        run: bash scripts/build/setup-verilator.sh

      - name: Save Verilator fakeroot cache (trusted contexts only)
        if: steps.cache-verilator.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/verilator/${{ env.VERILATOR_VERSION }}
          key: verilator-${{ matrix.os }}-${{ env.VERILATOR_VERSION }}-v1

      - name: Build native Picker
        env:
          INSTALL_APPDIR: ${{ matrix.full_test }}
        run: |
          if [[ "$INSTALL_APPDIR" == true ]]; then
            bash scripts/build/build-native.sh --install-appdir
          else
            bash scripts/build/build-native.sh
          fi

      - name: Upload build directory
        if: success() && matrix.full_test
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-builddir
          path: build

      - name: Archive AppDir with executable permissions
        if: matrix.full_test
        run: tar -C AppDir -czf appdir-${{ matrix.os }}.tar.gz .

      - name: Upload AppDir archive
        if: matrix.full_test
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-appdir
          path: appdir-${{ matrix.os }}.tar.gz
          if-no-files-found: error

      - name: Unit test (test_picker_utils)
        if: matrix.full_test
        run: |
          cmake --build build --target test_picker_utils -j"$(nproc)"
          ./build/bin/test_picker_utils

      - name: Full tests (make -C test all)
        if: matrix.full_test
        run: |
          make -C test all

      - name: Build Python wheels
        if: matrix.full_test
        run: |
          python3 -m venv /tmp/picker-wheel-builder
          /tmp/picker-wheel-builder/bin/python -m pip install 'build>=1,<2'
          make wheel PYTHON=/tmp/picker-wheel-builder/bin/python

      - name: Install wheels in a clean environment
        if: matrix.full_test
        run: bash scripts/build/verify-wheel.sh

      - name: Upload Python wheels
        if: matrix.full_test
        uses: actions/upload-artifact@v4
        with:
          name: picker-dev-wheels-${{ matrix.os }}-${{ github.sha }}
          path: dist/*.whl

      - name: Legacy Verilator VCD compatibility
        if: matrix.full_test == false
        run: |
          make -C test export_cachecfg

      - name: Cleanup generated artifacts
        if: always()
        run: |
          make -C test clean || true
          rm -f test_params.txt test_io.txt || true

  appimage-build:
    needs: build-and-test
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AppDir archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}-appdir
          path: appdir-archive

      - name: Restore AppDir and package AppImage
        run: |
          mkdir -p AppDir
          tar -C AppDir -xzf appdir-archive/appdir-${{ matrix.os }}.tar.gz
          bash scripts/build/package-appimage.sh

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-appimage
          path: '*.AppImage'

  docker-pr-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Docker-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.build-config.yml'

  docker-build-validate:
    needs: docker-pr-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && needs.docker-pr-changes.outputs.docker == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
