name: Documentation

on:
  pull_request:
    branches: [master]
    paths:
      - "doc/**"
      - "README*"
      - "CONTRIBUTING.md"
      - "test/README.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs.py"
      - "scripts/sync_wiki.py"
      - "tests/docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [master, "docs/**"]
    paths:
      - "doc/**"
      - "README*"
      - "CONTRIBUTING.md"
      - "test/README.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs.py"
      - "scripts/sync_wiki.py"
      - "tests/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Test documentation tooling
        run: python -m unittest discover -s tests/docs -v
      - name: Check translations, links and example syntax
        run: python scripts/docs.py check
      - name: Build documentation site
        run: python -m mkdocs build --strict
      - name: Export Wiki pages
        run: python scripts/docs.py wiki --output build/wiki-export
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: picker-documentation
          if-no-files-found: error
          path: |
            build/docs-site
            build/wiki-export

  sync-wiki:
    name: Sync GitHub Wiki
    needs: [documentation]
    if: >-
      github.repository == 'XS-MLVP/picker' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: wiki-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: picker-documentation
          path: build
      # GitHub requires an initial page created through the Wiki web UI.
      # Specifying ref avoids querying the REST API for the separate Wiki repo.
      - name: Checkout initialized Wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          ref: master
          path: wiki-checkout
      - name: Sync generated pages and push changes
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin master
          if ! git diff --quiet "$SOURCE_SHA" FETCH_HEAD -- doc/ "README*" CONTRIBUTING.md mkdocs.yml requirements-docs.txt scripts/docs.py scripts/sync_wiki.py tests/docs/ test/README.md .github/workflows/docs.yml; then
            echo "Documentation has advanced; skipping this outdated export."
            exit 0
          fi
          python scripts/sync_wiki.py --export build/wiki-export --checkout wiki-checkout
          git -C wiki-checkout add --all
          if git -C wiki-checkout diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git -C wiki-checkout config user.name 'github-actions[bot]'
          git -C wiki-checkout config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C wiki-checkout commit -m "Sync documentation from $SOURCE_SHA"
          git -C wiki-checkout push origin HEAD:master
